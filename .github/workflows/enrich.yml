name: enrich-site

on:
  schedule:
    - cron: "0 7 * * *"   # 04:00 BRT diario (UTC-3)
  workflow_dispatch:       # permite rodar manualmente via aba Actions
  push:
    paths:
      - 'scripts/enrich_site.py'
      - '.github/workflows/enrich.yml'

concurrency:
  group: enrich-site
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run enrichment
        run: python scripts/enrich_site.py

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html nightfeather/index.html
          if git diff --staged --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore(enrich): refresh VideoObject schema from YT RSS"
            git push
          fi
